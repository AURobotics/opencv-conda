
    - name: Upload artifact (Linux)
      if: matrix.os == 'ubuntu'
      uses: actions/upload-artifact@v4
      with:
        name: conda-packages-${{ matrix.CONFIG }}
        path: ./build_artifacts/conda-bld/**/*.conda
        retention-days: 1
        if-no-files-found: warn

    - name: Upload artifact (Windows)
      if: matrix.os == 'windows'
      uses: actions/upload-artifact@v4
      with:
        name: conda-packages-${{ matrix.CONFIG }}
        path: C:\bld\**\*.conda
        retention-days: 1
        if-no-files-found: warn
    
    - name: Upload artifact (macOS)
      if: matrix.os == 'macos'
      uses: actions/upload-artifact@v4
      with:
        name: conda-packages-${{ matrix.CONFIG }}
        path: |
          ./build_artifacts/**/*.conda
          ~/conda-bld/**/*.conda
        retention-days: 1
        if-no-files-found: warn