name: Update Upstream
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: generate-token
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Update submodule
        run: |
          cd upstream
          git fetch origin main --depth 1
          git checkout origin/main
          cd ..
          echo "NEW_SHA=$(cd upstream && git rev-parse HEAD)" >> $GITHUB_ENV
      
      - name: Patch workflow from upstream
        run: |
          ./patch-workflow.sh
          mkdir -p .github/workflows
          cp upstream/.github/workflows/conda-build.yml .github/workflows/

      - name: Configure Git
        run: |
          USER_ID=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config --global user.email "${USER_ID}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      
      - name: Commit workflow to automated-build
        run: |
          git checkout -b automated-build
          git add .github/workflows/conda-build.yml
          git commit -m "Sync workflow from upstream" || echo "No changes"
          git push --set-upstream origin automated-build