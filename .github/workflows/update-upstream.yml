name: Update Submodule
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Update submodule
        run: |
          cd upstream
          git fetch origin main --depth 1
          git checkout origin/main
          cd ..
          echo "NEW_SHA=$(cd upstream && git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Patch and copy workflow
        run: |
          ./patch-workflow.sh
          cp upstream/.github/workflows/conda-build.yml .github/workflows/
      
      - name: Commit workflow
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .github/workflows/conda-build.yml
          git commit -m "Sync workflow from upstream" || echo "No changes"
          git push