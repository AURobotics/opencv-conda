name: Update Upstream
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Update submodule
        run: |
          cd upstream
          git fetch origin main --depth 1
          git checkout origin/main
          cd ..
          echo "NEW_SHA=$(cd upstream && git rev-parse HEAD)" >> $GITHUB_ENV
      
      - name: Patch workflow from upstream
        run: |
          ./patch-workflow.sh
          mkdir -p .github/workflows
          cp upstream/.github/workflows/conda-build.yml .github/workflows/
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "⬆️ Update to upstream ${{ env.NEW_SHA }}"
          body: |
            Automated update from [conda-forge/opencv-feedstock](https://github.com/conda-forge/opencv-feedstock).
            
            **New commit:** `${{ env.NEW_SHA }}`
          branch: upstream-update
          commit-message: "chore: update upstream feedstock"
          delete-branch: true