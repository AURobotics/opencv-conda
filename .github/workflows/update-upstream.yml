name: Update Upstream
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: generate-token
        with:
          app-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: true
      
      - name: Update submodule
        run: |
          cd upstream
          git fetch origin main --depth 1
          git checkout origin/main
          cd ..
          echo "NEW_SHA=$(cd upstream && git rev-parse HEAD)" >> $GITHUB_ENV
      
      - name: Patch workflow from upstream
        run: |
          ./patch-workflow.sh
          mkdir -p .github/workflows
          cp upstream/.github/workflows/conda-build.yml .github/workflows/
      
      - name: Commit workflow to automated-build
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git branch -D automated-build 2>/dev/null || true
          git checkout -b automated-build
          
          git add upstream .github/workflows/conda-build.yml
          
          git commit -m "chore: update upstream to ${{ env.NEW_SHA }}" || echo "No changes"
          git push --force origin automated-build