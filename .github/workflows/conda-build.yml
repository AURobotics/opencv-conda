    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply GStreamer patches
        run: ../patch-build.sh

    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Build on Linux
      id: build-linux
      if: matrix.os == 'ubuntu'
      env:
        CONFIG: ${{ matrix.CONFIG }}
        UPLOAD_PACKAGES: ${{ matrix.UPLOAD_PACKAGES }}
        DOCKER_IMAGE: ${{ matrix.DOCKER_IMAGE }}
        CI: github_actions
        CONDA_FORGE_DOCKER_RUN_ARGS: "${{ matrix.CONDA_FORGE_DOCKER_RUN_ARGS }}"
      shell: bash
      run: |
        if [[ "$(uname -m)" == "x86_64" ]]; then
          echo "::group::Configure binfmt_misc"
          docker run --rm --privileged multiarch/qemu-user-static:register --reset --credential yes
        fi
        export flow_run_id="github_$GITHUB_RUN_ID"
        export remote_url="https://github.com/$GITHUB_REPOSITORY"
        export sha="$GITHUB_SHA"
        export FEEDSTOCK_NAME="$(basename $GITHUB_REPOSITORY)"
        export GIT_BRANCH="$(basename $GITHUB_REF)"
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          export IS_PR_BUILD="True"
        else
          export IS_PR_BUILD="False"
        fi
        echo "::endgroup::"
        ./.scripts/run_docker_build.sh

    - name: Build on macOS
      id: build-macos
      if: matrix.os == 'macos'
      env:
        CONFIG: ${{ matrix.CONFIG }}
        UPLOAD_PACKAGES: ${{ matrix.UPLOAD_PACKAGES }}
        CI: github_actions
      shell: bash
      run: |
        export flow_run_id="github_$GITHUB_RUN_ID"
        export remote_url="https://github.com/$GITHUB_REPOSITORY"
        export sha="$GITHUB_SHA"
        export FEEDSTOCK_NAME="$(basename $GITHUB_REPOSITORY)"
        export GIT_BRANCH="$(basename $GITHUB_REF)"
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          export IS_PR_BUILD="True"
        else
          export IS_PR_BUILD="False"
        fi
        ./.scripts/run_osx_build.sh

    - name: Build on windows
      id: build-windows
      if: matrix.os == 'windows'
      shell: cmd
      run: |
        set "flow_run_id=github_%GITHUB_RUN_ID%"
        set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
        set "sha=%GITHUB_SHA%"
        call ".scripts\run_win_build.bat"
      env:
        # default value; make it explicit, as it needs to match with artefact
        # generation below. Not configurable for now, can be revisited later
        CONDA_BLD_DIR: C:\bld
        MINIFORGE_HOME: ${{ contains(runner.arch, 'ARM') && 'C' || 'D' }}:\Miniforge
        PYTHONUNBUFFERED: 1
        CONFIG: ${{ matrix.CONFIG }}
        CI: github_actions
        UPLOAD_PACKAGES: ${{ matrix.UPLOAD_PACKAGES }}

    - name: Upload artifact (Linux)
      if: matrix.os == 'ubuntu'
      uses: actions/upload-artifact@v4
      with:
        name: conda-packages-${{ matrix.CONFIG }}
        path: ./build_artifacts/conda-bld/**/*.conda
        retention-days: 1
        if-no-files-found: warn

    - name: Upload artifact (Windows)
      if: matrix.os == 'windows'
      uses: actions/upload-artifact@v4
      with:
        name: conda-packages-${{ matrix.CONFIG }}
        path: C:\bld\**\*.conda
        retention-days: 1
        if-no-files-found: warn
    
    - name: Upload artifact (macOS)
      if: matrix.os == 'macos'
      uses: actions/upload-artifact@v4
      with:
        name: conda-packages-${{ matrix.CONFIG }}
        path: |
          ./build_artifacts/**/*.conda
          ~/conda-bld/**/*.conda
        retention-days: 1
        if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC and sigstore
      contents: read
      attestations: write  # Required for sigstore attestations
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: List packages to publish
        run: |
          echo "📋 Packages to publish:"
          find ./artifacts -name "*.conda" -type f -exec basename {} \;

      - name: Upload to prefix.dev
        run: |
          FAILED=0
          find ./artifacts -name "*.conda" -type f | while read pkg; do
            echo "📦 Uploading $(basename "$pkg")..."
            if pixi upload prefix \
                --channel aurobotics \
                "$pkg"; then
              echo "✅ Uploaded $(basename "$pkg")"
            else
              echo "❌ Failed to upload $(basename "$pkg")"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Generate summary
        if: always()
        run: |
          {
            echo "## 📦 Published OpenCV Packages"
            echo ""
            echo "| Platform | Python | Package |"
            echo "|----------|--------|---------|"
            find ./artifacts -name "*.conda" -type f | while read pkg; do
              name=$(basename "$pkg")
              if [[ "$name" == *"linux"* ]]; then
                platform="🐧 Linux"
              elif [[ "$name" == *"osx"* ]] || [[ "$name" == *"macos"* ]]; then
                platform="🍎 macOS"
              else
                platform="🪟 Windows"
              fi
              py_ver=$(echo "$name" | grep -oP 'py\K[0-9.]+' | head -1)
              echo "| $platform | $py_ver | \`$name\` |"
            done
            echo ""
            echo "**Channel:** https://prefix.dev/aurobotics"
          } >> $GITHUB_STEP_SUMMARY
