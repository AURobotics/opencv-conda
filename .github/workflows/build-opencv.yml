name: Build OpenCV with GStreamer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply GStreamer patches
        working-directory: upstream
        run: ../patch.sh
      
      - name: Copy upstream workflow
        run: |
          mkdir -p .github/workflows
          cp upstream/.github/workflows/conda-build.yml .github/workflows/
      
      - name: Run upstream build
        uses: ./.github/workflows/conda-build.yml

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: List packages to publish
        run: |
          echo "📋 Packages to publish:"
          find ./artifacts -name "*.conda" -type f -exec basename {} \;

      - name: Upload to prefix.dev
        run: |
          FAILED=0
          find ./artifacts -name "*.conda" -type f | while read pkg; do
            echo "📦 Uploading $(basename "$pkg")..."
            if pixi upload prefix \
                --channel aurobotics \
                "$pkg"; then
              echo "✅ Uploaded $(basename "$pkg")"
            else
              echo "❌ Failed to upload $(basename "$pkg")"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Generate summary
        if: always()
        run: |
          {
            echo "## 📦 Published OpenCV Packages"
            echo ""
            echo "| Platform | Python | Package |"
            echo "|----------|--------|---------|"
            find ./artifacts -name "*.conda" -type f | while read pkg; do
              name=$(basename "$pkg")
              if [[ "$name" == *"linux"* ]]; then
                platform="🐧 Linux"
              elif [[ "$name" == *"osx"* ]] || [[ "$name" == *"macos"* ]]; then
                platform="🍎 macOS"
              else
                platform="🪟 Windows"
              fi
              py_ver=$(echo "$name" | grep -oP 'py\K[0-9.]+' | head -1)
              echo "| $platform | $py_ver | \`$name\` |"
            done
            echo ""
            echo "**Channel:** https://prefix.dev/aurobotics"
          } >> $GITHUB_STEP_SUMMARY